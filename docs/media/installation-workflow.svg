<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">四步，把需要的功能放进轮盘</title><desc id="desc">官方插件通过客户端目录安装，下载与更新由你操作。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101426"/><stop offset="1" stop-color="#0b1120"/></linearGradient></defs>
<rect width="1100" height="650" rx="20" fill="url(#bg)"/>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif">
<text x="40" y="49" font-size="28" font-weight="700" fill="#f3f1ff">四步，把需要的功能放进轮盘</text>
<text x="40" y="81" font-size="17" fill="#b5bdd3">官方插件通过客户端目录安装，下载与更新由你操作。</text>
<g transform="translate(40 110)">
<rect width="500" height="215" rx="14" fill="#161d30" stroke="#303952"/>
<text x="24" y="45" font-size="26" font-weight="700" fill="#67b8f5">01</text>
<text x="77" y="44" font-size="23" font-weight="700" fill="#f2f3ff">刷新目录</text>
<text x="24" y="89" font-size="19" fill="#dce2f0">设置 → 插件与扩展</text>
<text x="24" y="124" font-size="19" fill="#dce2f0">在官方插件区域点击「刷新目录」</text>
<text x="24" y="159" font-size="19" fill="#dce2f0">选择需要的模块，无需全部安装</text>
</g>
<g transform="translate(560 110)">
<rect width="500" height="215" rx="14" fill="#161d30" stroke="#303952"/>
<text x="24" y="45" font-size="26" font-weight="700" fill="#a59bff">02</text>
<text x="77" y="44" font-size="23" font-weight="700" fill="#f2f3ff">安装模块</text>
<text x="24" y="89" font-size="19" fill="#dce2f0">选择模块并点击「安装」</text>
<text x="24" y="124" font-size="19" fill="#dce2f0">由客户端核对大小、哈希与兼容性</text>
<text x="24" y="159" font-size="19" fill="#dce2f0">模块文件由宿主管理</text>
</g>
<g transform="translate(40 345)">
<rect width="500" height="215" rx="14" fill="#161d30" stroke="#303952"/>
<text x="24" y="45" font-size="26" font-weight="700" fill="#cf9bfa">03</text>
<text x="77" y="44" font-size="23" font-weight="700" fill="#f2f3ff">按需启用</text>
<text x="24" y="89" font-size="19" fill="#dce2f0">根据需要启用已安装模块</text>
<text x="24" y="124" font-size="19" fill="#dce2f0">在插件列表中管理、停用或卸载</text>
<text x="24" y="159" font-size="19" fill="#dce2f0">官方包通过目录安装，不走社区导入</text>
</g>
<g transform="translate(560 345)">
<rect width="500" height="215" rx="14" fill="#161d30" stroke="#303952"/>
<text x="24" y="45" font-size="26" font-weight="700" fill="#66d2c0">04</text>
<text x="77" y="44" font-size="23" font-weight="700" fill="#f2f3ff">配置使用</text>
<text x="24" y="89" font-size="19" fill="#dce2f0">轮盘动作中选择插件动作与参数</text>
<text x="24" y="124" font-size="19" fill="#dce2f0">桌宠、悬浮球等也可通过设置管理</text>
<text x="24" y="159" font-size="19" fill="#dce2f0">轮盘音效在插件设置中选择主题</text>
</g>
<text x="40" y="610" font-size="17" fill="#b5bdd3">安装流程示意，非实际界面截图。.spkg 为官方分发容器；社区手动导入入口仅接收 .dll。</text>
</g></svg>
