<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="pieGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="pieGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="pieGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Base Card Background -->
  <rect x="0" y="0" width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="0" y="0" width="1200" height="340" rx="16" fill="url(#cyanGlow)" />
  <rect x="0" y="0" width="1200" height="340" rx="16" fill="url(#purpleGlow)" />

  <!-- Subtle Top Highlight Border -->
  <path d="M 16,1 L 1184,1" stroke="url(#borderGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Decorative Background Grid Elements -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="340" stroke-dasharray="4 8" />
    <line x1="320" y1="0" x2="320" y2="340" stroke-dasharray="4 8" />
    <line x1="720" y1="0" x2="720" y2="340" stroke-dasharray="4 8" />
    <line x1="1120" y1="0" x2="1120" y2="340" stroke-dasharray="4 8" />
    <line x1="0" y1="90" x2="1200" y2="90" stroke-dasharray="4 8" />
    <line x1="0" y1="250" x2="1200" y2="250" stroke-dasharray="4 8" />
  </g>

  <!-- Radial Menu Icon Mark (Left Visual) -->
  <g transform="translate(145, 170)">
    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />
    <circle cx="0" cy="0" r="92" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

    <!-- 8 Wheel Sectors (Pie Wedge Visuals) -->
    <!-- Sector 1 (Top) -->
    <path d="M 0,-34 L 0,-84 A 84 84 0 0 1 59,-59 L 24,-24 A 34 34 0 0 0 0,-34 Z" fill="url(#pieGrad1)" opacity="0.9" />
    <!-- Sector 2 (Top-Right) -->
    <path d="M 24,-24 L 59,-59 A 84 84 0 0 1 84,0 L 34,0 A 34 34 0 0 0 24,-24 Z" fill="url(#pieGrad2)" opacity="0.85" />
    <!-- Sector 3 (Right) -->
    <path d="M 34,0 L 84,0 A 84 84 0 0 1 59,59 L 24,24 A 34 34 0 0 0 34,0 Z" fill="url(#pieGrad3)" opacity="0.9" />
    <!-- Sector 4 (Bottom-Right) -->
    <path d="M 24,24 L 59,59 A 84 84 0 0 1 0,84 L 0,34 A 34 34 0 0 0 24,24 Z" fill="#475569" opacity="0.5" />
    <!-- Sector 5 (Bottom) -->
    <path d="M 0,34 L 0,84 A 84 84 0 0 1 -59,59 L -24,24 A 34 34 0 0 0 0,34 Z" fill="#334155" opacity="0.6" />
    <!-- Sector 6 (Bottom-Left) -->
    <path d="M -24,24 L -59,59 A 84 84 0 0 1 -84,0 L -34,0 A 34 34 0 0 0 -24,24 Z" fill="#475569" opacity="0.5" />
    <!-- Sector 7 (Left) -->
    <path d="M -34,0 L -84,0 A 84 84 0 0 1 -59,-59 L -24,-24 A 34 34 0 0 0 -34,0 Z" fill="url(#pieGrad2)" opacity="0.75" />
    <!-- Sector 8 (Top-Left) -->
    <path d="M -24,-24 L -59,-59 A 84 84 0 0 1 0,-84 L 0,-34 A 34 34 0 0 0 -24,-24 Z" fill="url(#pieGrad1)" opacity="0.85" />

    <!-- Center Core Hub -->
    <circle cx="0" cy="0" r="28" fill="#0b1120" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Star Icon in Center -->
    <polygon points="0,-14 4,-4 14,-4 6,3 9,13 0,7 -9,13 -6,3 -14,-4 -4,-4" fill="#38bdf8" />

    <!-- Decorative Satellite Dots -->
    <circle cx="0" cy="-105" r="4" fill="#38bdf8" />
    <circle cx="74" cy="-74" r="3.5" fill="#818cf8" />
    <circle cx="105" cy="0" r="4" fill="#c084fc" />
    <circle cx="-74" cy="74" r="3" fill="#64748b" />
  </g>

  <!-- Typography & Text Content -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Super-header Badge -->
    <g transform="translate(300, 52)">
      <rect x="0" y="0" width="175" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="12" cy="13" r="4" fill="#38bdf8" />
      <text x="24" y="17" font-size="12" font-weight="600" fill="#bae6fd" letter-spacing="0.5">STARPIE PLUGINS</text>
    </g>

    <!-- Main Title -->
    <text x="300" y="122" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      StarPie 官方插件与模块仓库
    </text>

    <!-- Subtitle / English Title -->
    <text x="300" y="156" font-size="17" font-weight="500" fill="#94a3b8">
      Official High-Performance Modular Ecosystem for StarPie Radial Menu
    </text>

    <!-- Tagline & Architecture Core Pillars -->
    <text x="300" y="196" font-size="14" font-weight="400" fill="#cbd5e1">
      <tspan fill="#38bdf8" font-weight="600">原生进程内加载</tspan> · 独立 ALC 隔离 · 每次发布仅打包变更模块 · 签名 Catalog 全量引用
    </text>

    <!-- 4 Highlighting Badges (Bottom Row) -->
    <g transform="translate(300, 235)">
      <!-- Badge 1: 19 Modules -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" font-size="11" font-weight="500" fill="#94a3b8">收录模块</text>
        <text x="14" y="34" font-size="14" font-weight="700" fill="#38bdf8">19 个官方模块</text>
      </g>

      <!-- Badge 2: StarPie v2.0.0+ -->
      <g transform="translate(196, 0)">
        <rect x="0" y="0" width="190" height="42" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" font-size="11" font-weight="500" fill="#94a3b8">宿主兼容</text>
        <text x="14" y="34" font-size="14" font-weight="700" fill="#818cf8">StarPie v2.0.0 正式版</text>
      </g>

      <!-- Badge 3: Verification & Security -->
      <g transform="translate(402, 0)">
        <rect x="0" y="0" width="205" height="42" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" font-size="11" font-weight="500" fill="#94a3b8">安全机制</text>
        <text x="14" y="34" font-size="14" font-weight="700" fill="#c084fc">SHA-256 验签 · 故障隔离</text>
      </g>

      <!-- Badge 4: Zero Telemetry -->
      <g transform="translate(623, 0)">
        <rect x="0" y="0" width="195" height="42" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" font-size="11" font-weight="500" fill="#94a3b8">分发模式</text>
        <text x="14" y="34" font-size="14" font-weight="700" fill="#34d399">手动按需 · 零后台联网</text>
      </g>
    </g>
  </g>
</svg>
