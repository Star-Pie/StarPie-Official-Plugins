name: Official module bug
description: Report a problem with an official StarPie module
title: '[Module] '
labels: ['bug', 'module']
body:
  - type: input
    id: module
    attributes:
      label: Module
      placeholder: 'Launch / Ocr / Tile / ...'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Module version
      placeholder: '1.0.0'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text