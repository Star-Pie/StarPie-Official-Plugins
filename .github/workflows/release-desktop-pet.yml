name: DesktopPet standalone package
on:
  pull_request:
    paths:
      - 'src/StarPie.Plugin.DesktopPet/**'
      - 'tests/io.github.softblack42.desktoppet/**'
      - 'sdk/**'
      - 'build/Prepare-DesktopPetRelease.ps1'
      - '.github/workflows/release-desktop-pet.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the independently distributed DesktopPet package'
        type: boolean
        default: false
        required: true
concurrency:
  group: desktop-pet-${{ github.event_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.package.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Prepare and verify the standalone package
        id: package
        shell: pwsh
        run: ./build/Prepare-DesktopPetRelease.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-${{ github.run_id }}
          path: artifacts/desktop-pet-release/*
          if-no-files-found: error
      - name: Require an explicit main-branch publication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main' -or '${{ vars.SIGNING_ENABLED }}' -ne 'true') {
            throw 'Publication requires main and the existing signing policy.'
          }
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Download this run's verified package
        uses: actions/download-artifact@v4
        with:
          name: desktop-pet-${{ github.run_id }}
          path: artifacts/desktop-pet-release
      - uses: sigstore/cosign-installer@v3
      - name: Sign and verify the package
        shell: pwsh
        run: |
          $package = Get-Content artifacts/desktop-pet-release/package.json -Raw | ConvertFrom-Json
          $path = Join-Path $PWD ('artifacts/desktop-pet-release/' + $package.assetName)
          if ($package.assetName -notmatch '^StarPie\.Plugin\.DesktopPet-\d+\.\d+\.\d+\.spkg$' -or (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $package.sha256) { throw 'Artifact identity/checksum mismatch.' }
          ./build/Sign-Artifact.ps1 -Path $path -Mode cosign -OutputPath ($path + '.sigstore.json')
          cosign verify-blob --bundle ($path + '.sigstore.json') --certificate-identity '${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-desktop-pet.yml@${{ github.ref }}' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' $path
          if ($LASTEXITCODE -ne 0) { throw 'Package signature verification failed.' }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/desktop-pet-release/*.spkg
      - name: Publish DesktopPet independently without changing the official catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ needs.package.outputs.release_tag }}'
          $package = Get-Content artifacts/desktop-pet-release/package.json -Raw | ConvertFrom-Json
          if ($tag -cne ('desktop-pet-v' + $package.version)) { throw 'Tag/package version mismatch.' }
          $existingTag = @(git ls-remote origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check remote tag; publication stopped.' }
          if ($existingTag.Count -ne 0) { throw 'This tag already exists; do not overwrite release history.' }
          $releases = @(gh api --paginate 'repos/${{ github.repository }}/releases?per_page=100' --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check existing Releases; publication stopped.' }
          if ($releases -contains $tag) { throw 'This Release already exists; do not overwrite release history.' }
          $path = Join-Path $PWD ('artifacts/desktop-pet-release/' + $package.assetName)
          $zip = [IO.Path]::ChangeExtension($path, '.zip')
          gh release create $tag $path $zip ($path + '.sigstore.json') artifacts/desktop-pet-release/SHA256SUMS.txt --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "DesktopPet v$($package.version) — beta.7 / SDK 1.11" --notes-file docs/desktop-pet-release.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'DesktopPet release creation failed; do not overwrite an existing version.' }
          $publishedTagCommit = gh api 'repos/${{ github.repository }}/git/ref/tags/${{ needs.package.outputs.release_tag }}' --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $publishedTagCommit -cne '${{ github.sha }}') { throw 'Published tag commit does not match the verified source.' }
